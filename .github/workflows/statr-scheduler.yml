name: Statr MLB Scheduler

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        default: "due"
        type: choice
        options:
          - due
          - poll
          - settle
      date:
        description: "Optional slate date, like 2026-06-24"
        required: false
        type: string
      force:
        description: "Force all games for the selected date"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "*/5 * * * *"
    - cron: "30 8 * * *"

concurrency:
  group: statr-mlb-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Choose endpoint
        id: endpoint
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TASK="${{ inputs.task }}"
          elif [[ "${{ github.event.schedule }}" == "30 8 * * *" ]]; then
            TASK="settle"
          else
            TASK="due"
          fi

          DATE=""
          FORCE="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DATE="${{ inputs.date }}"
            FORCE="${{ inputs.force }}"
          fi

          if [[ "$TASK" == "settle" ]]; then
            PATH_TO_CALL="/api/cron-mlb-settle"
          elif [[ "$TASK" == "poll" ]]; then
            PATH_TO_CALL="/api/cron-mlb-poll"
          else
            PATH_TO_CALL="/api/cron-mlb-due"
          fi

          QUERY=""
          if [[ -n "$DATE" ]]; then
            QUERY="date=$DATE"
          fi
          if [[ "$FORCE" == "true" ]]; then
            if [[ -n "$QUERY" ]]; then
              QUERY="$QUERY&force=true"
            else
              QUERY="force=true"
            fi
          fi
          if [[ -n "$QUERY" ]]; then
            PATH_TO_CALL="$PATH_TO_CALL?$QUERY"
          fi

          echo "path=$PATH_TO_CALL" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel endpoint
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PATH_TO_CALL: ${{ steps.endpoint.outputs.path }}
        run: |
          test -n "$VERCEL_APP_URL"
          test -n "$CRON_SECRET"

          call_endpoint() {
            local path="$1"
            curl --fail --show-error --silent \
              --max-time 290 \
              --retry 1 \
              --retry-delay 10 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$VERCEL_APP_URL$path"
          }

          call_endpoint "$PATH_TO_CALL"

          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$PATH_TO_CALL" == /api/cron-mlb-due* ]]; then
            call_endpoint "/api/cron-mlb-poll"
          fi
