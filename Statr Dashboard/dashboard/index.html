<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statr MLB Slate</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="daily-panel">
        <div class="eyebrow">Daily Slate</div>
        <div class="daily-head">
          <h1 id="slate-date">Today</h1>
          <div class="record-line">
            <strong id="daily-record">0-0</strong>
            <span>&middot;</span>
            <strong id="daily-net" class="money">$0.00</strong>
            <span>&middot;</span>
            <span>on <span id="daily-staked">$0</span> staked</span>
          </div>
        </div>
        <div id="pick-list" class="pick-list"></div>
      </section>

      <section class="stats-grid">
        <article class="stat-card">
          <div class="card-title"><span class="dot green"></span>Season Overall <span id="season-settled"></span></div>
          <div class="card-metrics">
            <div><small>Record</small><strong id="season-record">0-0</strong><span id="season-wr">0.0% WR</span></div>
            <div><small>Net P/L</small><strong id="season-net">$0</strong><span id="season-roi">0.0% ROI</span></div>
            <div><small>Units</small><strong id="season-units">0.0u</strong><span>1u = $50</span></div>
          </div>
        </article>

        <article class="stat-card">
          <div class="card-title"><span class="dot violet"></span>Top Picks <span id="top-settled"></span></div>
          <div class="card-metrics">
            <div><small>Record</small><strong id="top-record">0-0</strong><span id="top-wr">0.0% WR</span></div>
            <div><small>Net P/L</small><strong id="top-net">$0</strong><span id="top-roi">0.0% ROI</span></div>
            <div><small>Units</small><strong id="top-units">0.0u</strong><span>Strong/Solid</span></div>
          </div>
        </article>
      </section>

      <p class="footnote">Net P/L uses tracked stake and American odds when available. Pending picks do not count until settled.</p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
